version: '3.8'

services:
  bot:
    build:
      context: .
      dockerfile: Dockerfile.bot
    environment:
      - TELEGRAM_TOKEN=${TELEGRAM_TOKEN}
      - WEBAPP_URL=${WEBAPP_URL:-http://webapp:8000}
      - DATABASE_URL=sqlite:////app/data/ssh_connections.db
      - ENCRYPTION_KEY=${ENCRYPTION_KEY:-change_this_to_a_secure_key!}
    volumes:
      - shared-data:/app/data
    restart: unless-stopped
    depends_on:
      - webapp
    networks:
      - tg-network

  webapp:
    build:
      context: .
      dockerfile: webapp/Dockerfile
    ports:
      - "${WEBAPP_PORT:-8000}:8000"
    environment:
      - TELEGRAM_TOKEN=${TELEGRAM_TOKEN}
      - TELEGRAM_BOT_TOKEN=${TELEGRAM_TOKEN}
      - DATABASE_URL=sqlite:////app/data/ssh_connections.db
      - ENCRYPTION_KEY=${ENCRYPTION_KEY:-change_this_to_a_secure_key!}
      - WEBAPP_URL=${WEBAPP_URL:-http://localhost:8000}
      - PORT=8000
    volumes:
      - shared-data:/app/data
    restart: unless-stopped
    networks:
      - tg-network

networks:
  tg-network:
    driver: bridge

volumes:
  shared-data:
    driver: local